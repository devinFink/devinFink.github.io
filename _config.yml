  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-seo-tag

exclude:
  - .idea
  - .claude
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
