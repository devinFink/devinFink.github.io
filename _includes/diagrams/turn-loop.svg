<text class="dg-s" x="263" y="268" text-anchor="middle">win / lose</text>
<path class="edge " d="M767.5,122 L767.5,226" marker-end="url(#ah-turn-loop)"/>
<path class="edge " d="M670,254 L590,254" marker-end="url(#ah-turn-loop)"/>
