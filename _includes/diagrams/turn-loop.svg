<text class="dg-s" x="409.5" y="108" text-anchor="middle">valid targets</text>
<rect class="box " x="506" y="66" width="135" height="56" rx="10"/>
<text x="573.5" y="91" text-anchor="middle">Pick target hex</text>
<text class="dg-s" x="573.5" y="108" text-anchor="middle">range check</text>
