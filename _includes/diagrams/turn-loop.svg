<svg class="dg" viewBox="0 0 820 316" role="img" aria-label="Turn-based game loop" xmlns="http://www.w3.org/2000/svg">
<title>Turn-based game loop</title>
<defs><marker id="ah-turn-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f849c"/></marker></defs>
<rect class="zone" x="4" y="24" width="812" height="160" rx="14"/>
<text class="dg-h" x="18" y="44">PLAYER TURN</text>
<rect class="box box-blue" x="14" y="66" width="135" height="56" rx="10"/>
<text x="81.5" y="91" text-anchor="middle">Player turn</text>
<text class="dg-s" x="81.5" y="108" text-anchor="middle">refresh actions</text>
<rect class="box " x="178" y="66" width="135" height="56" rx="10"/>
<text x="245.5" y="91" text-anchor="middle">Select unit</text>
