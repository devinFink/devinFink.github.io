<svg class="dg" viewBox="0 0 820 270" role="img" aria-label="Combat and health data flow" xmlns="http://www.w3.org/2000/svg">
<title>Combat and health data flow</title>
<defs><marker id="ah-combat-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f849c"/></marker></defs>
<rect class="box box-blue" x="10" y="40" width="140" height="56" rx="10"/>
