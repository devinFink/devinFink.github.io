<path class="edge " d="M320,68 L345,68" marker-end="url(#ah-combat-flow)"/>
<path class="edge " d="M490,68 L515,68" marker-end="url(#ah-combat-flow)"/>
<path class="edge " d="M660,68 L685,68" marker-end="url(#ah-combat-flow)"/>
