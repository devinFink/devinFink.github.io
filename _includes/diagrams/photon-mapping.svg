<svg class="dg" viewBox="0 0 820 350" role="img" aria-label="Two-pass photon mapping renderer" xmlns="http://www.w3.org/2000/svg">
<title>Two-pass photon mapping renderer</title>
<defs><marker id="ah-photon-mapping" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f849c"/></marker></defs>
