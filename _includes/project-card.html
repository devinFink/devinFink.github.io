{%- assign p = include.project -%}
<a class="tile" href="{{ p.url | relative_url }}"{% if p.thumb_video %} data-video{% endif %}>
<div class="tile-media">
<img src="{{ p.thumb | relative_url }}" alt="{{ p.title }}" loading="lazy">
{%- if p.thumb_video %}
<video class="tile-alt" src="{{ p.thumb_video | relative_url }}" muted loop playsinline preload="none"></video>
{%- elsif p.thumb_alt %}
<img class="tile-alt" src="{{ p.thumb_alt | relative_url }}" alt="" loading="lazy">
{%- endif %}
</div>
<h3 class="tile-title">{{ p.title }}</h3>
<p class="tile-desc">{{ p.summary }}</p>
<p class="tile-meta">{{ p.engine }} &middot; {% if p.team == 'Solo' %}Solo{% else %}Team of {{ p.team }}{% endif %}</p>
</a>
